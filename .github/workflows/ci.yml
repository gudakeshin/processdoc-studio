name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migtest
        options: >-
          --health-cmd="pg_isready -U postgres -d migtest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=25.3" "setuptools>=78.1.1"
          pip install -e ".[dev]"
          pip install pip-audit
      - name: pip-audit (dependency vulnerabilities)
        # pygments CVE-2026-4539: ReDoS in optional lexer; local-access only; no fixed release in DB yet.
        run: pip-audit --desc on --ignore-vuln CVE-2026-4539
      - name: Pytest with coverage
        run: pytest app/tests -q --cov=app --cov-report=term-missing
      - name: Skill script smoke suite
        run: pytest app/tests/test_skill_scripts_smoke.py -q
      - name: Epic 2 + 3 smoke (deck exporter, web capture, handoff, parity, quality, narrative)
        # Dedicated surface for the PPT-20x / PPT-30x work so regressions are
        # visible per-epic via a named junit artifact rather than buried in the
        # full pytest run.
        run: |
          mkdir -p reports
          pytest \
            app/tests/test_deck_exporter.py \
            app/tests/test_web_capture.py \
            app/tests/test_handoff_bundle.py \
            app/tests/test_pptx_canvas_parity_harness.py \
            app/tests/test_quality_framework_phase2.py \
            app/tests/test_narrative_feedback.py \
            app/tests/test_tool_round_preview.py \
            -q --junit-xml=reports/epic-2-3-smoke.xml
      - name: Upload Epic 2 + 3 junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic-2-3-smoke-junit
          path: backend/reports/epic-2-3-smoke.xml
          if-no-files-found: warn
      - name: PPTX canvas parity spikes (strict)
        run: make -C .. pptx.canvas.parity
      - name: Alembic upgrade smoke (Postgres)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/migtest
          PYTHONPATH: .
        run: python -m alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high severity and above)
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: UI style / WCAG audit
        run: npm run ui:style-audit
      - name: Test
        run: npm test
      - name: Vitest
        run: npm run test:vitest
      - name: Build
        run: npm run build
